name: CI

on:
  push:
  pull_request:

# This workflow never touches Square: no real SQUARE_ACCESS_TOKEN secret
# is configured, no extraction command runs against Square, and no raw
# data is uploaded. The Silver/dbt steps below run against a small
# synthetic fixture (scripts/generate_synthetic_bronze.py) so the whole
# pipeline — Bronze -> Silver -> dbt Gold models and tests — is verified
# on every push without any credentials or real business data.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

      - name: Run linter
        run: ruff check .

      - name: Run credential-free security check
        run: python3 scripts/security_check.py

      - name: Generate synthetic Bronze fixture (no Square credentials)
        run: python3 scripts/generate_synthetic_bronze.py data/bronze

      - name: Run Silver transform on synthetic data
        run: retailpulse transform-silver
        # No Square token needed — transform-silver is a purely local step.
        env:
          RAW_DATA_DIR: data/bronze

      - name: Run dbt build against synthetic data
        run: |
          mkdir -p data/gold
          dbt build --project-dir dbt --profiles-dir dbt
        env:
          RETAILPULSE_SILVER_DIR: ${{ github.workspace }}/data/silver
          RETAILPULSE_WAREHOUSE_PATH: ${{ github.workspace }}/data/gold/warehouse.duckdb

      - name: Smoke-test dashboard KPI queries
        run: python3 scripts/smoke_dashboard_queries.py
        env:
          RETAILPULSE_WAREHOUSE_PATH: ${{ github.workspace }}/data/gold/warehouse.duckdb

      - name: Verify no raw Bronze/Silver/Gold data is tracked
        run: |
          if git ls-files | grep -qE '^data/(bronze|silver|gold)/'; then
            echo "Raw data files are tracked in Git. Failing build."
            git ls-files | grep -E '^data/(bronze|silver|gold)/'
            exit 1
          fi
          echo "No raw data directories are tracked."

      - name: Verify .env is not tracked
        run: |
          if git ls-files | grep -qx '.env'; then
            echo ".env is tracked in Git. Failing build."
            exit 1
          fi
          echo ".env is not tracked."
