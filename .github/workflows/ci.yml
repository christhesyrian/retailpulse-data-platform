name: CI

on:
  push:
  pull_request:

# This workflow never touches Square: no SQUARE_ACCESS_TOKEN secret is
# configured, no extraction command runs, and no raw data is uploaded.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

      - name: Run linter
        run: ruff check .

      - name: Run credential-free security check
        run: python3 scripts/security_check.py

      - name: Verify no raw Bronze/Silver/Gold data is tracked
        run: |
          if git ls-files | grep -qE '^data/(bronze|silver|gold)/'; then
            echo "Raw data files are tracked in Git. Failing build."
            git ls-files | grep -E '^data/(bronze|silver|gold)/'
            exit 1
          fi
          echo "No raw data directories are tracked."

      - name: Verify .env is not tracked
        run: |
          if git ls-files | grep -qx '.env'; then
            echo ".env is tracked in Git. Failing build."
            exit 1
          fi
          echo ".env is not tracked."
