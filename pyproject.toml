[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "0.1.0"
description = "Production-style retail data platform built from Square commerce data."
readme = "README.md"
# The upper bound is real, not defensive. `dagster-dbt` publishes no wheel
# that installs on 3.14: the only 3.14-compatible builds pin `dagster==1.12.7/8`,
# which themselves cap at <3.14, so pip silently backtracks to a 2023-era
# dagster and drags dbt-core down to 1.7.x with it. Declaring the ceiling turns
# that silent, destructive resolution into an install-time error. 3.11 is also
# what CI runs, so local and CI resolve the same tree.
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "duckdb>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  # Pinned exactly, not ranged. A range meant CI resolved a newer ruff than
  # the local venv, so `ruff check .` passed locally and failed in CI on
  # rules the local version didn't have. Bump this deliberately.
  "ruff==0.16.1",
  "dbt-core>=1.10,<2.0",
  "dbt-duckdb>=1.10,<2.0",
]
# Presentation layer only — kept separate so CI (which builds and tests the
# pipeline) doesn't need to install Streamlit and its UI dependency tree.
dashboard = [
  "streamlit>=1.40,<2.0",
]
# Orchestration. Both pins are exact and must be bumped together: dagster-dbt
# 0.X.N depends on `dagster==1.(X-16).N`, so a ranged pin on either one lets pip
# resolve a mismatched pair and then backtrack years to satisfy it. The mapping
# for this pair is dagster-dbt 0.29.16 <-> dagster 1.13.16.
#
# dagster-dbt also constrains dbt-core to <1.12, which is why the resolved
# dbt-core is 1.11.x rather than the 1.12.0 a bare `[dev]` install would pick.
# CI installs `[dev,orchestration]` for exactly this reason — installing only
# `[dev]` there would test the pipeline against a different dbt than the one
# the orchestrator actually runs.
orchestration = [
  "dagster==1.13.16",
  "dagster-dbt==0.29.16",
  "dagster-webserver==1.13.16",
]
# Cloud warehouse adapters, for the `prod` and `snowflake` dbt targets. Kept
# out of `dev` deliberately: the project must stay clonable and runnable with no
# cloud account at all, so CI and `make dbt-build` use DuckDB and never install
# these. Pinned exactly, like everything else here — these resolve alongside
# dbt-core 1.11.x without moving it, and a ranged pin is what would let that
# drift silently on someone else's machine.
warehouses = [
  "dbt-bigquery==1.12.0",
  "dbt-snowflake==1.12.0",
]

[project.scripts]
retailpulse = "retailpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Declared explicitly rather than relying on ruff's defaults, which shift
# between releases — that drift is what turned CI red while local lint was
# green. E/F are the long-standing set this project was already held to; I
# (import sorting) is added because it's deterministic and auto-fixable.
# Widening this is a deliberate, separate change: `ruff check . --statistics`
# shows what each additional rule set would flag.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# `design` is a sibling module of dashboard/app.py, not a PyPI package.
# Without this, isort files it under third-party next to pandas, which reads
# as though it were an external dependency.
known-first-party = ["retailpulse", "design"]

[tool.pytest.ini_options]
pythonpath = ["src"]
