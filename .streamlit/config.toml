# RetailPulse design tokens.
#
# These are set through Streamlit's own theming API rather than by injecting
# CSS at the generated class names, because the class names change between
# releases and this doesn't. dashboard/design.py carries only the handful of
# rules this file genuinely can't express, and the same palette values so the
# charts match the chrome.
#
# Colours are the validated data-viz palette: categorical slot 1 (blue) and
# slot 2 (orange), warm near-white / near-black surfaces. Both modes were run
# through the palette validator against their own surface — all six checks
# pass (lightness band, chroma floor, CVD separation, normal-vision floor,
# contrast). Re-run the validator before changing any of these hexes.

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# "minimal" keeps the useful bits of the toolbar (rerun, fullscreen a chart)
# and drops the Deploy button and developer options, which mean nothing to
# someone reading the hosted demo and are the first thing in every screenshot.
toolbarMode = "minimal"

[theme]
# Light, for everyone. The validated light palette is declared inline here
# rather than under [theme.light], and there is deliberately no [theme.dark]
# section: Streamlit switches to [theme.dark] whenever that section exists,
# following the viewer's OS setting, which makes `base` alone a no-op. Removing
# it is what actually pins the appearance.
#
# The dashboard used to follow the OS, so anyone with a dark desktop met a
# near-black page with saturated blue. Legible — the dark palette passed the
# same six validator checks — but it reads as a terminal rather than as a book
# of accounts, and this is a tool for reading a shop's takings.
#
# The dark palette is not lost: DARK still lives in dashboard/design.py, and
# restoring OS-following is re-adding a [theme.dark] block with those values.
base = "light"

backgroundColor = "#f9f9f7"          # page plane
secondaryBackgroundColor = "#fcfcfb" # card / chart surface
textColor = "#0b0b0b"
primaryColor = "#2a78d6"             # categorical slot 1, light step
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
dataframeHeaderBackgroundColor = "#f0efec"
linkColor = "#2a78d6"
codeBackgroundColor = "#f0efec"
greenColor = "#006300"               # success text step for the light surface
redColor = "#d03b3b"
yellowColor = "#fab219"
orangeColor = "#eb6834"              # categorical slot 2, light step
chartCategoricalColors = [
  "#2a78d6", "#eb6834", "#1baf7a", "#eda100",
  "#e87ba4", "#008300", "#4a3aa7", "#e34948",
]
chartSequentialColors = [
  "#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec",
  "#5598e7", "#3987e5", "#2a78d6", "#256abf", "#1c5cab",
]

# System sans everywhere, including the big numbers — no display face.
font = "'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
headingFont = "'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
codeFont = "'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
baseFontSize = 15

# Type scale for h1..h6. The page never uses h1 — the app header is its own
# component — so the scale starts at the section-heading sizes.
headingFontSizes = ["1.5rem", "1.125rem", "1rem", "0.9375rem", "0.875rem", "0.8125rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

# Softly rounded, not pill-shaped: a data tool, not a marketing page.
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true

# Sized so the widest realistic figure fits without an ellipsis. Money is
# shown to the cent, and a year of trade puts "$1,410,710.24" — 13 characters
# — in a quarter-width tile; at 2rem that truncated. Raise this only after
# checking the longest value the 365-day view actually renders.
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600

[theme.sidebar]
backgroundColor = "#f0efec"
secondaryBackgroundColor = "#fcfcfb"
borderColor = "#e1e0d9"
textColor = "#0b0b0b"
