version: 2

models:
  - name: dim_period
    description: >
      The time windows the dashboard offers (Last 7/30/90/365 days, All time)
      with each window's bounds and the equivalent preceding window. Joining
      against this is what makes the KPI models period-aware.
    columns:
      - name: period_label
        data_tests:
          - not_null
          - unique
      - name: period_order
        data_tests:
          - not_null
          - unique
      - name: period_start
        data_tests:
          - not_null
      - name: period_end
        data_tests:
          - not_null

  - name: dim_location
    description: One row per Square location. SCD2 columns are placeholders — see model comment.
    columns:
      - name: location_key
        data_tests:
          - not_null
          - unique
      - name: square_location_id
        data_tests:
          - not_null
          - unique

  - name: dim_item
    description: One row per catalog item variation, joined against its item and category.
    columns:
      - name: item_key
        data_tests:
          - not_null
          - unique
      - name: square_catalog_object_id
        data_tests:
          - not_null
          - unique

  - name: fact_order_line
    description: >
      One row per order line item. Publishes Square's raw UTC `closed_at`
      alongside `closed_at_local` / `sale_date` in the location's own
      timezone; every downstream mart reads the local ones rather than
      re-deriving a date from UTC. See tests/assert_local_time_conversion.sql.
    columns:
      - name: order_line_key
        data_tests:
          - not_null
          - unique
      - name: square_order_id
        data_tests:
          - not_null
      # sale_date deliberately carries NO not_null test: Square returns a
      # small number of order lines with no closed_at at all (18 of 146,554
      # here — orders that were never closed), and those are genuinely
      # undated. The real invariant, asserted in
      # tests/assert_local_time_conversion.sql, is that sale_date is null
      # exactly when closed_at is.
      - name: location_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: item_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_item')
                field: item_key

  - name: fact_payment
    description: One row per payment.
    columns:
      - name: square_payment_id
        data_tests:
          - not_null
          - unique
      - name: location_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key

  - name: dim_vendor
    description: One row per vendor named in the operator-maintained cost file.
    columns:
      - name: vendor_key
        data_tests:
          - not_null
          - unique
      - name: vendor_name
        data_tests:
          - not_null
          - unique

  - name: fact_inventory_snapshot
    description: One row per item variation, location, and snapshot time.
    columns:
      - name: inventory_snapshot_key
        data_tests:
          - not_null
          - unique
      - name: quantity_on_hand
        data_tests:
          - not_null
      - name: item_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_item')
                field: item_key

  - name: fact_order_line_margin
    description: Order lines enriched with vendor cost, COGS, and gross profit/margin.
    columns:
      - name: order_line_key
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fact_order_line')
                field: order_line_key
      - name: has_cost
        data_tests:
          - not_null
