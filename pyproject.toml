[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "0.1.0"
description = "Production-style retail data platform built from Square commerce data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "duckdb>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.5,<1.0",
  "dbt-core>=1.10,<2.0",
  "dbt-duckdb>=1.10,<2.0",
]
# Presentation layer only — kept separate so CI (which builds and tests the
# pipeline) doesn't need to install Streamlit and its UI dependency tree.
dashboard = [
  "streamlit>=1.40,<2.0",
]

[project.scripts]
retailpulse = "retailpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
