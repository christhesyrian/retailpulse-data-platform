name: CI

on:
  push:
  pull_request:

# This workflow never touches Square: no real SQUARE_ACCESS_TOKEN secret
# is configured, no extraction command runs against Square, and no raw
# data is uploaded. The Silver/dbt steps below run against a small
# synthetic fixture (scripts/generate_synthetic_bronze.py) so the whole
# pipeline — Bronze -> Silver -> dbt Gold models and tests — is verified
# on every push without any credentials or real business data.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # `orchestration` is installed here, not just `dev`, because dagster-dbt
        # constrains dbt-core to <1.12. Installing only `[dev]` would test the
        # pipeline against a newer dbt than the orchestrator actually runs —
        # the same CI-vs-local resolution drift that already cost this project
        # a red build once, in a place nobody would think to look.
        run: pip install -e '.[dev,orchestration]'

      - name: Run linter
        run: ruff check .

      - name: Run credential-free security check
        run: python3 scripts/security_check.py

      - name: Parse dbt project
        # Generates dbt/target/manifest.json. This has to happen *before*
        # pytest: `@dbt_assets` reads the manifest at import time to build the
        # asset graph, so the orchestration tests cannot even import without
        # it. `parse` touches no data and needs no warehouse — only the env
        # vars that profiles.yml and _sources.yml resolve.
        run: dbt parse --project-dir dbt --profiles-dir dbt
        env:
          RETAILPULSE_SILVER_DIR: ${{ github.workspace }}/data/silver
          RETAILPULSE_INPUT_DIR: ${{ github.workspace }}/data/input
          RETAILPULSE_WAREHOUSE_PATH: ${{ github.workspace }}/data/gold/warehouse.duckdb

      - name: Run unit tests
        run: pytest -q
        env:
          RETAILPULSE_SILVER_DIR: ${{ github.workspace }}/data/silver
          RETAILPULSE_INPUT_DIR: ${{ github.workspace }}/data/input
          RETAILPULSE_WAREHOUSE_PATH: ${{ github.workspace }}/data/gold/warehouse.duckdb

      - name: Generate synthetic Bronze fixture (no Square credentials)
        run: python3 scripts/generate_synthetic_bronze.py data/bronze

      - name: Run Silver transform on synthetic data
        run: retailpulse transform-silver
        # No Square token needed — transform-silver is a purely local step.
        env:
          RAW_DATA_DIR: data/bronze

      - name: Generate synthetic vendor costs (no real cost data)
        run: python3 scripts/generate_synthetic_vendor_costs.py

      - name: Run dbt build against synthetic data
        # ensure_dbt_inputs.py is the same step `make dbt-build` runs. The
        # optional vendor-cost and category-override files must exist for the
        # staging models to read, even when empty; CI used to skip that and
        # only failed once an earlier step stopped failing first.
        run: |
          python3 scripts/ensure_dbt_inputs.py
          dbt build --project-dir dbt --profiles-dir dbt
        env:
          RETAILPULSE_SILVER_DIR: ${{ github.workspace }}/data/silver
          RETAILPULSE_INPUT_DIR: ${{ github.workspace }}/data/input
          RETAILPULSE_WAREHOUSE_PATH: ${{ github.workspace }}/data/gold/warehouse.duckdb

      - name: Verify the incremental build
        # Every other step here starts from an empty warehouse, so the build
        # above only ever exercises fact_order_line's *first* run — the
        # incremental path, and the late-arriving-edit case it exists to
        # handle, would otherwise never be tested. This runs that scenario
        # against its own fixture in a temp directory: no credentials, no
        # dependency on the warehouse the previous steps built.
        run: python3 scripts/verify_incremental.py

      - name: Smoke-test dashboard KPI queries
        run: python3 scripts/smoke_dashboard_queries.py
        env:
          RETAILPULSE_WAREHOUSE_PATH: ${{ github.workspace }}/data/gold/warehouse.duckdb

      - name: Validate Dagster definitions
        # Loads every asset, check, job and schedule exactly as the scheduler
        # would. A broken asset graph is otherwise invisible until a run fails
        # at 2am, because nothing else in this workflow executes Dagster.
        run: dagster definitions validate -m retailpulse.orchestration.definitions
        env:
          RETAILPULSE_SILVER_DIR: ${{ github.workspace }}/data/silver
          RETAILPULSE_INPUT_DIR: ${{ github.workspace }}/data/input
          RETAILPULSE_WAREHOUSE_PATH: ${{ github.workspace }}/data/gold/warehouse.duckdb

      - name: Verify no raw data (Bronze/Silver/Gold/input) is tracked
        run: |
          if git ls-files | grep -qE '^data/(bronze|silver|gold|input)/'; then
            echo "Raw/business data files are tracked in Git. Failing build."
            git ls-files | grep -E '^data/(bronze|silver|gold|input)/'
            exit 1
          fi
          echo "No raw data directories are tracked."

      - name: Verify .env is not tracked
        run: |
          if git ls-files | grep -qx '.env'; then
            echo ".env is tracked in Git. Failing build."
            exit 1
          fi
          echo ".env is not tracked."
