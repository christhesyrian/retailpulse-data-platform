version: 2

models:
  - name: kpi_daily_sales
    description: One row per calendar day (including zero-sales days) with daily sales KPIs.
    columns:
      - name: sale_date
        data_tests:
          - not_null
          - unique
      - name: net_sales_cents
        data_tests:
          - not_null

  # The models below are keyed on (period_label, <key>). Composite uniqueness
  # is asserted in tests/assert_period_kpi_grain.sql — dbt's built-in `unique`
  # test is single-column only and dbt_utils isn't a dependency here.
  - name: kpi_sales_by_category
    description: >
      Net sales and unit volume by product category per period, with share of
      the period total and change vs. the previous equivalent window.
    columns:
      - name: period_label
        data_tests:
          - not_null
      - name: category_name
        data_tests:
          - not_null

  - name: kpi_sales_by_weekday
    description: Sales by ISO day of week (1=Monday..7=Sunday), per period.
    columns:
      - name: period_label
        data_tests:
          - not_null
      - name: day_of_week
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                # quote: false because these are integers. dbt quotes the
                # values by default, and while DuckDB and Snowflake coerce
                # INT IN (STRING...) happily, BigQuery refuses: "No matching
                # signature for operator IN for argument types INT64 and
                # {STRING}".
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false

  - name: kpi_sales_by_hour
    description: Sales by hour of day (0..23, UTC), per period.
    columns:
      - name: period_label
        data_tests:
          - not_null
      - name: hour_of_day
        data_tests:
          - not_null

  - name: kpi_payment_methods
    description: Amount collected and processing fees by tender type, per period.
    columns:
      - name: period_label
        data_tests:
          - not_null
      - name: source_type
        data_tests:
          - not_null

  - name: kpi_summary
    description: >
      Headline KPIs, one row per period, each with the previous equivalent
      window and the change against it.
    columns:
      - name: period_label
        data_tests:
          - not_null
          - unique
      - name: orders
        data_tests:
          - not_null

  - name: kpi_data_coverage
    description: >
      Single-row description of the extracted window (date range, days, weeks,
      orders, items) and how stale the most recent sale is.
    columns:
      - name: first_sale_date
        data_tests:
          - not_null
      - name: last_sale_date
        data_tests:
          - not_null
      - name: days_covered
        data_tests:
          - not_null
      - name: orders
        data_tests:
          - not_null

  - name: rpt_order_payment_reconciliation
    description: Per-order reconciliation of recorded order totals vs. payments collected.
    columns:
      - name: square_order_id
        data_tests:
          - not_null
          - unique
      - name: reconciliation_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'overpaid', 'short', 'order_without_payment', 'payment_without_order']

  - name: kpi_margin_by_category
    description: Gross profit and margin by category (costed lines only).
    columns:
      - name: category_name
        data_tests:
          - not_null
          - unique

  - name: kpi_margin_by_vendor
    description: Gross profit and margin by vendor (costed lines only).
    columns:
      - name: vendor_name
        data_tests:
          - not_null
          - unique

  - name: kpi_inventory_position
    description: Current stock position per item with days-of-inventory and reorder signal.
    columns:
      - name: square_catalog_object_id
        data_tests:
          - not_null
          - unique
      - name: stock_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['no_recent_sales', 'reorder_soon', 'watch', 'ok']

  - name: kpi_item_weekly_sales
    description: Per-item, per-ISO-week units/orders/net sales — the base sales time series.
    columns:
      - name: variation_id
        data_tests:
          - not_null
      - name: week_start
        data_tests:
          - not_null

  - name: kpi_item_sales
    description: >
      Per-item sales per period, with the previous equivalent window and the
      change against it. Keyed on (period_label, variation_id).
    columns:
      - name: period_label
        data_tests:
          - not_null
      - name: variation_id
        data_tests:
          - not_null
      - name: units
        data_tests:
          - not_null

  - name: kpi_item_forecast
    description: >
      Per-item weekly sales forecast for the next 4 weeks (linear trend / avg
      fallback), fitted on a zero-filled weekly series so weeks with no sales
      count against the trend instead of being dropped.
    columns:
      - name: variation_id
        data_tests:
          - not_null
      - name: forecast_units
        data_tests:
          - not_null
      - name: method
        data_tests:
          - accepted_values:
              arguments:
                values: ['linear_trend', 'avg_fallback']
