name: retailpulse
version: "1.0.0"
config-version: 2
profile: retailpulse

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

# Categories whose sales are structurally different from merchandise: the
# customer chooses the store, not the product, and volume tracks jackpots
# rather than anything the owner controls. They are always the top sellers, so
# leaving them in a "best sellers" list crowds out every item a buying decision
# could actually be made about. Flagged, never dropped — they are real revenue
# and get their own view.
vars:
  lottery_categories: ["SCRATCHER", "LOTTO"]

models:
  retailpulse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

# Snapshots live in their own schema because they are the one stateful thing
# here. Every model can be dropped and rebuilt from Bronze; a snapshot cannot,
# because it *is* the record of what changed and when. Keeping them apart makes
# that distinction visible to anyone poking around the warehouse.
snapshots:
  retailpulse:
    +schema: snapshots
