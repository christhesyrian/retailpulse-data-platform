version: 2

sources:
  - name: silver
    description: >
      RetailPulse Silver layer — deduplicated, flattened Parquet files
      written by src/retailpulse/transform/silver.py. dbt-duckdb reads
      these directly off disk (the local "lake") via read_parquet();
      nothing is copied into the warehouse database until a staging
      model materializes it.
    meta:
      external_location: "{{ env_var('RETAILPULSE_SILVER_DIR') }}/{name}.parquet"
    tables:
      - name: locations
        description: One row per Square location.
      - name: catalog_items
        description: One row per catalog item variation, joined against its item and category.
      - name: order_lines
        description: One row per order line item, flattened from Square's nested orders.
      - name: payments
        description: One row per payment, with card details minimized to brand + last 4.
      - name: inventory_snapshots
        description: Latest IN_STOCK count per item variation and location.

  - name: reference
    description: >
      Operator-maintained reference data that does NOT come from Square.
      vendor_costs is OPTIONAL — a git-ignored CSV under data/input/ (real
      acquisition costs are business data and must never be committed).
      Explicit column types are declared so a header-only file (no cost data
      yet) reads as zero rows rather than failing type inference. `make
      dbt-build` guarantees the file exists (header-only if you haven't
      supplied one), so margin models simply show no coverage when costs are
      absent instead of breaking the build.
    meta:
      # auto_detect handles a header-only file (no cost data yet) as zero rows
      # with all-VARCHAR columns; stg_vendor_costs try_casts unit_cost_cents.
      external_location: "read_csv('{{ env_var('RETAILPULSE_INPUT_DIR', 'data/input') }}/{name}.csv', header=true, auto_detect=true)"
    tables:
      - name: vendor_costs
        description: One row per item variation — vendor and unit acquisition cost in cents (optional).
      - name: category_overrides
        description: >
          Optional raw_category -> canonical_category map to merge typos and
          synonyms Square's catalog can't (e.g. a mis-spelled BEVERGE ->
          BEVERAGE). Also git-ignored under data/input/; generate a starter
          with scripts/generate_category_overrides.py.
